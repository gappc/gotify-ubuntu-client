[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
gotify-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2", features = ["serde"] }
toml = "1"
thiserror = "2"
tokio = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
oo7 = { version = "0.7", default-features = false, features = ["tokio", "native_crypto"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
tempfile = "3"
wiremock = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
